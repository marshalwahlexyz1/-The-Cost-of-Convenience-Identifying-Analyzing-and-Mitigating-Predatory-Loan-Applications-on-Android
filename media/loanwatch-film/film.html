.hdr { position: absolute; left: 36px; top: 24px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }

.pill svg { width: 22px; height: 22px; }
.gr > .rowglow { position: absolute; inset: 0; padding: 0; background: linear-gradient(90deg, rgba(56,189,248,.38), rgba(56,189,248,.06)); box-shadow: inset 4px 0 0 #38bdf8; z-index: 0; }

  box-shadow: 0 0 0 2px rgba(56,189,248,.35), 0 30px 90px -20px rgba(56,189,248,.7); }

<script>
// ── LoanWatch explainer · 1080×1350 · every frame is a pure function of T (seconds) ──
const W = 1080, H = 1350, DURATION = 35;
// Scene windows (absolute seconds)
const HOOK = [0, 3.0], CARD = [3.0, 12.4], UP = [12.4, 16.4], AI = [16.4, 20.6], SCAN = [20.6, 26.4], REP = [26.4, 31.6], END = [31.6, 35];
const P = { problem: 3.0, help: 6.8, who: 9.4 };

const CUES = [];
const cue = (t, kind, gain = 1) => CUES.push({ t: +t.toFixed(3), kind, gain });

// ── maths ─────────────────────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const io = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out = (x) => 1 - Math.pow(1 - x, 3);
const mix = (a, b, k) => a + (b - a) * k;
function sp(t0, t, f = 2.2, z = .8) {
  const x = t - t0; if (x <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z / Math.sqrt(1 - z * z)) * Math.sin(wd * x));
}
const exitP = (t, end, dur = .4) => { const p = clamp((t - (end - dur)) / dur); return p * p * p; };
const $ = (id) => document.getElementById(id);
const tf = (el, x = 0, y = 0, s = 1, o = 1, r = 0) => {
  el.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${s.toFixed(4)}) rotate(${r.toFixed(2)}deg)`;
  el.style.opacity = clamp(o).toFixed(3);
  el.style.visibility = o <= .001 ? "hidden" : "visible";
};
const rect = (el, [x, y, w, h], r) => {
  el.style.left = x.toFixed(2) + "px"; el.style.top = y.toFixed(2) + "px";
  el.style.width = w.toFixed(2) + "px"; el.style.height = h.toFixed(2) + "px";
  if (r !== undefined) el.style.borderRadius = r.toFixed(2) + "px";
};
const lerpR = (a, b, k) => a.map((v, i) => mix(v, b[i], k));
const icon = (id) => `<svg class="i"><use href="#${id}"/></svg>`;
const words = (txt, cls = "") => txt.split(" ").map((w) => `<span class="m"><span class="${cls}">${w}</span></span>`).join(" ");
function rise(root, t0, t, step = .035, skip = 0) {
  root.querySelectorAll(".m > span").forEach((s, i) => {
    if (i < skip) { s.style.transform = "none"; return; }
    const p = sp(t0 + (i - skip) * step, t, 2.5, .84);
    s.style.transform = `translateY(${((1 - p) * 110).toFixed(2)}%)`;
  });
}
const add = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); const el = d.firstChild; $("root").appendChild(el); return el; };
const el = (id, cls, r, html = "", extra = "") => { const e = add(`<div id="${id}" class="a ${cls}" style="${extra}">${html}</div>`); if (r) rect(e, r); return e; };
// live window: element shown only inside [a, b]
const within = (t, a, b) => t >= a && t <= b;

// ── layout (px) ───────────────────────────────────────────────────────────
const R = {
  hookPhone: [150, 250, 330, 660], server: [770, 290, 150, 150],
  cardP: [80, 300, 920, 790], cardH: [80, 370, 920, 650], cardW: [80, 270, 920, 850],
  apk: [80, 400, 440, 500], pdf: [560, 400, 440, 500], btn: [80, 1010, 920, 104],
  chip: [740, 112, 260, 60], doc: [80, 330, 920, 330],
  scanPhone: [80, 320, 420, 860], k0: [540, 330, 460, 200], k1: [540, 560, 460, 200], k2: [540, 790, 460, 200],
  v0: [80, 300, 920, 160], v1: [80, 484, 920, 160], grid: [80, 680, 920, 402],
  badge: [110, 345, 70, 70], logo: [430, 320, 220, 220],
};

// ── build ─────────────────────────────────────────────────────────────────
const stepNames = ["Upload", "Policy", "Scan", "Report"];

// ── seek ──────────────────────────────────────────────────────────────────
function stepper(T) {
  const starts = [UP[0], AI[0], SCAN[0], REP[0]];
  const on = lin(T, UP[0] - .15, UP[0] + .2) * (1 - lin(T, REP[1] - .35, REP[1] - .05));
  tf($("stepper"), 0, (1 - on) * -14, 1, on);
  tf($("tag"), 0, 0, 1, Math.max(1 - lin(T, 2.6, 2.95), on));
  starts.forEach((s, i) => {
    const active = T >= s - .05, done = i < 3 && T >= starts[i + 1] - .05;
    const st = $("st" + i), d = st.querySelector(".d");
    st.style.color = active ? "var(--ink)" : "var(--faint)";
    d.style.borderColor = active ? "var(--accent)" : "var(--line2)";
    d.style.background = done ? "var(--accent)" : "var(--surface)";
    d.style.color = done ? "#04121c" : active ? "var(--accent)" : "var(--faint)";
    if (i < 3) $("ln" + i).style.transform = `scaleX(${io(lin(T, starts[i + 1] - .5, starts[i + 1])).toFixed(4)})`;
  });
}

function hook(T) {
  const vis = T < HOOK[1] + .4;
  const q = lin(T, 2.55, 2.95);
  tf($("hServer"), 0, 0, 1 + .06 * Math.exp(-Math.max(0, T - 1.85) * 4) * (T > 1.85 ? 1 : 0), vis ? 1 - q : 0);
  $("hPath").style.opacity = vis ? (1 - q).toFixed(3) : 0;
  $("hLine").setAttribute("stroke-dashoffset", (-T * 40).toFixed(1));
  tf($("hLabel"), 0, 0, 1, vis ? 1 - q : 0);
  tf($("hPhone"), 0, Math.sin(T * 1.3) * 5, 1, T < 2.72 ? 1 : 0);
  const pts = [[440, 470], [610, 300], [770, 365]];
  [0, 1, 2].forEach((i) => {
    const t0 = .5 + i * .3, k = io(lin(T, t0, t0 + 1.0));
    const x = (1 - k) ** 2 * pts[0][0] + 2 * (1 - k) * k * pts[1][0] + k * k * pts[2][0];
    const y = (1 - k) ** 2 * pts[0][1] + 2 * (1 - k) * k * pts[1][1] + k * k * pts[2][1];
    const o = T < t0 ? 0 : k < .9 ? clamp((T - t0) * 6) : 1 - lin(k, .9, 1);
    tf($("hF" + i), x - 40, y - 40, .75 + .35 * Math.sin(Math.PI * k), o);
  });
  tf($("hTitle"), 0, 0, 1, 1 - q);
  rise($("hTitle"), -10, T, 0, 99);
}

function card(T) {
  const pop = $("pop");
  const vis = T >= 2.7 && T <= 12.75;
  pop.style.display = vis ? "block" : "none";
  if (!vis) return;
  // shape: phone → problem → help → who → upload card
  const k0 = io(lin(T, 2.72, 3.3));
  const kh = io(lin(T, P.help - .1, P.help + .35)), kw = io(lin(T, P.who - .1, P.who + .35)), ku = io(lin(T, 12.2, 12.72));
  let r = lerpR(R.hookPhone, R.cardP, k0);
  r = lerpR(r, R.cardH, kh); r = lerpR(r, R.cardW, kw); r = lerpR(r, R.apk, ku);
  rect(pop, r, mix(mix(52, 34, k0), 30, ku));
  const float = Math.sin(T * 1.1) * 4 * k0 * (1 - ku);
  tf(pop, 0, float, 1, 1);
  $("popPhone").style.opacity = (1 - k0).toFixed(3);
  $("popUpload").style.opacity = ku.toFixed(3);
  // header + pane crossfades overlap the reshape (no empty shell)
  const segs = [[2.95, P.help], [P.help, P.who], [P.who, 12.2]];
  segs.forEach(([a, b], i) => {
    const inn = out(clamp((T - a + .1) / .25)), gone = clamp((T - b + .3) / .2);
    tf($("hd" + i), 0, (1 - inn) * 10 - gone * 10, 1, inn * (1 - gone));
    tf($("pn" + i), 0, (1 - inn) * 18 - gone * 16, 1, inn * (1 - gone));
  });
  rise($("pt0"), -10, T, 0, 99);
  [[434, 3.45], [141, 3.7], [147, 3.95], [93, 4.2]].forEach(([n, t0], i) => {
    const p = sp(t0, T, 2.6, .8);
    tf($("stt" + i), 0, (1 - p) * 30, .95 + .05 * p, clamp(p * 1.7));
    $("stv" + i).textContent = Math.round(n * out(lin(T, t0, t0 + .6)));
  });
  // a slow light sweep across the stats keeps the hold alive
  const sw = lin(T, 4.9, 6.5);
  [0, 1, 2, 3].forEach((i) => { const d = Math.abs(sw * 4 - i - .5); $("stt" + i).style.borderColor = `rgba(255,93,108,${(.55 * clamp(1 - d)).toFixed(3)})`; });
  tf($("psrc"), 0, 0, 1, lin(T, 4.5, 4.9));
  rise($("pt1"), -10, T, 0, 99);
  [0, 1, 2].forEach((i) => { const p = sp(P.help + .15 + i * .3, T, 2.6, .76); tf($("fs" + i), 0, (1 - p) * 26, .8 + .2 * p, clamp(p * 1.7)); });
  // a dot travels policy → app → evidence, again and again
  const dk = ((T - (P.help + 1.0)) / 1.1);
  const dp = dk < 0 ? 0 : dk % 1;
  tf($("flowDot"), 152 + io(dp) * 516, 0, 1, dk < 0 ? 0 : Math.sin(Math.PI * dp));
  rise($("pt2"), -10, T, 0, 99);
  for (let i = 0; i < 7; i++) { const p = sp(P.who + .1 + i * .12, T, 2.7, .78); tf($("rl" + i), 0, (1 - p) * 22, .94 + .06 * p, clamp(p * 1.7)); }
  const g = lin(T, 11.2, 11.6) * (1 - lin(T, 12.0, 12.2));
  $("rl6").style.boxShadow = `0 0 ${(30 * g).toFixed(1)}px rgba(56,189,248,${(.5 * g).toFixed(3)})`;
}

function upload(T) {
  const on = within(T, UP[0], UP[1] + .3), ex = exitP(T, UP[1], .35);
  const tin = sp(UP[0] + .05, T, 2.3, .84);
  tf($("uKick"), 0, (1 - tin) * 16, 1, on ? clamp(tin * 1.5) * (1 - ex) : 0);
  tf($("uTitle"), 0, -ex * 40, 1, on ? 1 - ex : 0);
  rise($("uTitle"), UP[0] + .1, T, .035);
  // APK card: the pop card lands here at 12.72, then hands over to the carrier at 16.15
  tf($("uApk"), 0, 0, 1, lin(T, 12.42, 12.7) * (1 - lin(T, 16.12, 16.3)));
  const pp = sp(12.55, T, 2.3, .82);
  tf($("uPdf"), (1 - pp) * 80, 0, 1, clamp(pp * 1.6) * (1 - lin(T, 16.12, 16.3)));
  const f0 = sp(13.2, T, 1.9, .76), f1 = sp(13.55, T, 1.9, .76);
  $("uApkF").style.transform = `rotateY(${(f0 * 180).toFixed(2)}deg)`;
  $("uPdfF").style.transform = `rotateY(${(f1 * 180).toFixed(2)}deg)`;
  $("pg0").style.transform = `scaleX(${out(lin(T, 15.1, 15.9)).toFixed(4)})`;
  $("pg1").style.transform = `scaleX(${out(lin(T, 15.25, 16.0)).toFixed(4)})`;
  const bp = sp(13.85, T, 2.4, .84);
  const press = T > 14.95 && T < 15.25 ? .97 : 1;
  tf($("uBtn"), 0, (1 - bp) * 60 + ex * 40, press, on ? clamp(bp * 1.6) * (1 - ex) : 0);
  // cursor
  const cIn = lin(T, 14.15, 14.4) * (1 - lin(T, 15.5, 15.8));
  const ck = io(lin(T, 14.15, 14.9));
  tf($("cursor"), mix(1000, 560, ck), mix(1290, 1050, ck), T > 14.92 && T < 15.15 ? .85 : 1, cIn);
}

function carriers(T) {
  // APK: card → chip (16.15-16.7) → phone (20.45-21.05)
  const a1 = io(lin(T, 16.2, 16.75)), a2 = io(lin(T, 20.45, 21.05));
  const apkVis = T >= 16.12 && T < 21.05;
  let r = lerpR(R.apk, R.chip, a1); r = lerpR(r, R.scanPhone, a2);
  rect($("apkC"), r, mix(mix(30, 18, a1), 62, a2));
  tf($("apkC"), 0, 0, 1, apkVis ? lin(T, 16.12, 16.28) : 0);
  $("acCard").style.opacity = (1 - a1).toFixed(3);
  $("acChip").style.opacity = (a1 * (1 - a2)).toFixed(3);
  $("acPhone").style.opacity = a2.toFixed(3);
  const isz = mix(mix(104, 40, a1), 104, a2);
  const ix = mix(mix(168, 14, a1), 158, a2), iy = mix(mix(130, 12, a1), 160, a2);
  rect($("acIcon"), [ix, iy, isz, isz]);
  $("acIcon").firstChild.style.borderRadius = (isz * .27).toFixed(1) + "px";
  const lx = mix(mix(126, 66, a1), 126, a2), ly = mix(mix(258, 16, a1), 280, a2);
  $("acLabel").style.left = lx + "px"; $("acLabel").style.top = ly + "px";
  $("acLabel").style.opacity = (lin(T, 16.7, 16.85) * (1 - lin(T, 20.4, 20.5))).toFixed(3);
  $("acLabel").style.fontSize = mix(25, 23, a1).toFixed(1) + "px";
  // PDF: card → clause card (16.15-16.75)
  const p1 = io(lin(T, 16.2, 16.75));
  rect($("pdfC"), lerpR(R.pdf, R.doc, p1), 30);
  tf($("pdfC"), 0, 0, 1, T >= 16.12 && T < 16.75 ? lin(T, 16.12, 16.28) : 0);
  $("pcDoc").style.opacity = p1.toFixed(3);
  tf($("pcIcon"), mix(0, 360, p1), mix(0, 20, p1), 1 - .4 * p1, 1 - p1);
  // counter k0 → national verdict (26.15-26.7)
  const v = io(lin(T, 26.15, 26.7));
  rect($("vC"), lerpR(R.k0, R.v0, v), mix(26, 28, v));
  tf($("vC"), 0, 0, 1, T >= 26.15 && T < 26.72 ? 1 - lin(T, 26.52, 26.7) : 0);
  $("vcB").style.opacity = v.toFixed(3);
  const nx = mix(30, 920 - 34 - 46, v), ny = mix(106, 40, v);
  $("vcN").style.left = nx + "px"; $("vcN").style.top = ny + "px";
  // verdict badge → logo (31.3-31.95)
  const l = io(lin(T, 31.3, 31.95));
  rect($("lC"), lerpR(R.badge, R.logo, l), mix(20, 60, l));
  tf($("lC"), 0, l >= 1 ? Math.sin(T * 1.4) * 4 : 0, 1, T >= 31.3 ? 1 : 0);
  $("lC").style.boxShadow = `0 0 ${mix(30, 90, l).toFixed(0)}px rgba(${l < .5 ? "255,93,108" : "56,189,248"},.55)`;
  $("lcB").style.opacity = lin(l, .42, .58).toFixed(3);
  $("lcI0").style.opacity = (1 - lin(l, .2, .6)).toFixed(3);
  $("lcI1").style.opacity = lin(l, .4, .9).toFixed(3); $("lcI2").style.opacity = lin(l, .6, 1).toFixed(3);
}

function ai(T) {
  const on = within(T, AI[0] - .1, AI[1] + .3), ex = exitP(T, AI[1], .35);
  const k = sp(AI[0], T, 2.3, .84);
  tf($("aKick"), 0, (1 - k) * 16, 1, on ? clamp(k * 1.5) * (1 - ex) : 0);
  tf($("aTitle"), 0, -ex * 40, 1, on ? 1 - ex : 0);
  rise($("aTitle"), AI[0] + .1, T, .035);
  tf($("aDoc"), 0, -ex * 40, 1, T < AI[1] + .3 ? lin(T, 16.5, 16.72) * (1 - ex) : 0);
  [0, 1, 2].forEach((i) => { $("hl" + i).querySelector("i").style.transform = `scaleX(${out(lin(T, 17.1 + i * .22, 17.45 + i * .22)).toFixed(4)})`; });
  chipDefs.forEach((d, i) => {
    const t0 = i < 4 ? 17.85 + i * .3 : 19.0 + (i - 4) * .2, p = sp(t0, T, 3, .74);
    tf($("ch" + i), 0, ex * 40, .6 + .4 * p, on ? clamp(p * 1.7) * (1 - ex) : 0);
  });
  // a pulse runs through the dashed group chips (keeps the hold moving)
  [4, 5, 6].forEach((i) => { const w = Math.sin((T - 19.6) * 4 - (i - 4) * .9); $("ch" + i).style.borderColor = T > 19.6 ? `rgba(56,189,248,${(.35 + .35 * Math.max(0, w)).toFixed(3)})` : "var(--line2)"; });
  const links = [[1, 0], [0, 1], [2, 2], [2, 3]];   // contacts→READ_CONTACTS, call logs→READ_CALL_LOG, photos→both
  links.forEach(([h, c], i) => {
    const pth = $("lk" + i), dot = $("lkd" + i);
    const vis = on && T > 17.5;
    if (!vis) { pth.setAttribute("d", ""); dot.setAttribute("opacity", 0); return; }
    const a = $("hl" + h).getBoundingClientRect(), b = $("ch" + c).getBoundingClientRect();
    const docB = $("aDoc").getBoundingClientRect().bottom;
    const x1 = a.left + a.width / 2, y1 = docB + 2, x2 = b.left + b.width / 2, y2 = b.top - 4;
    const d = `M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${x1.toFixed(1)} ${((y1 + y2) / 2).toFixed(1)}, ${x2.toFixed(1)} ${((y1 + y2) / 2).toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`;
    pth.setAttribute("d", d);
    const len = pth.getTotalLength();
    const k = io(lin(T, 17.5 + i * .3, 18.0 + i * .3));
    pth.setAttribute("stroke-dasharray", `${len.toFixed(1)} ${len.toFixed(1)}`);
    pth.setAttribute("stroke-dashoffset", ((1 - k) * len).toFixed(1));
    pth.setAttribute("opacity", ((1 - ex) * .75).toFixed(3));
    const ph = ((T - 19.0 - i * .25) / 1.2);
    if (ph > 0) { const pt = pth.getPointAtLength((ph % 1) * len); dot.setAttribute("cx", pt.x.toFixed(1)); dot.setAttribute("cy", pt.y.toFixed(1));
      dot.setAttribute("opacity", (Math.sin(Math.PI * (ph % 1)) * (1 - ex)).toFixed(3)); } else dot.setAttribute("opacity", 0);
  });
  const np = sp(19.45, T, 2.4, .86);
  tf($("aNote"), 0, (1 - np) * 16, 1, on ? clamp(np * 1.6) * (1 - ex) : 0);
}

function scan(T) {
  const on = within(T, SCAN[0] - .1, SCAN[1] + .3), ex = exitP(T, SCAN[1], .35);
  const k = sp(SCAN[0], T, 2.3, .84);
  tf($("sKick"), 0, (1 - k) * 16, 1, on ? clamp(k * 1.5) * (1 - ex) : 0);
  tf($("sTitle"), 0, -ex * 40, 1, on ? 1 - ex : 0);
  rise($("sTitle"), SCAN[0] + .1, T, .035);
  // phone body = the APK carrier until 21.05, then this element (same rect, same skin)
  tf($("sIn"), 0, -ex * 40, 1, T < SCAN[1] + .3 ? lin(T, 20.8, 21.02) * (1 - ex) : 0);
  $("sIcon").style.opacity = T >= 21.05 ? 1 : 0;
  $("sIn").style.background = "linear-gradient(160deg,#2a3550,#0d1322)";
  $("sIn").style.boxShadow = "inset 0 0 0 2px rgba(255,255,255,.07),0 0 0 1px rgba(56,189,248,.25),0 30px 70px -20px rgba(56,189,248,.35)";
  const bt = (T - 21.3) / 1.5;
  $("sBeam").style.top = (bt < 0 ? -120 : (bt % 1) * 950 - 120).toFixed(1) + "px";
  const hits = { 0: 21.9, 1: 22.5, 3: 23.1 };
  let declared = 0;
  cats.forEach((_, i) => {
    const c = $("ci" + i), h = hits[i];
    if (h !== undefined && T >= h) {
      declared++;
      const p = sp(h, T, 3, .7);
      c.style.color = "#fff"; c.style.background = `rgba(255,93,108,${(.28 * clamp(p)).toFixed(3)})`;
      c.style.borderColor = "rgba(255,93,108,.8)"; c.style.boxShadow = `0 0 ${(24 * clamp(p)).toFixed(1)}px rgba(255,93,108,.6)`;
      c.style.transform = `scale(${(.6 + .4 * p).toFixed(4)})`; $("cat" + i).style.color = "#ffd1d6";
    } else {
      c.style.color = "#4d5c80"; c.style.background = "rgba(255,255,255,.04)"; c.style.borderColor = "rgba(255,255,255,.07)";
      c.style.boxShadow = "none"; c.style.transform = "none"; $("cat" + i).style.color = "#4d5c80";
    }
  });
  [0, 1, 2].forEach((i) => {
    const p = sp(SCAN[0] + .35 + i * .12, T, 2.3, .84);
    const keep = i === 0 ? T < 26.15 : true;            // k0 hands over to the verdict carrier
    tf($("k" + i), (1 - p) * 50, -ex * 40 * (i ? 1 : 0), 1, on && keep ? clamp(p * 1.6) * (i ? 1 - ex : 1) : 0);
  });
  const vals = [declared, Math.round(7 * out(lin(T, 23.6, 24.3))), Math.round(2 * out(lin(T, 24.7, 25.2)))];
  vals.forEach((v, i) => { $("kv" + i).textContent = v; $("kv" + i).style.color = v > 0 ? "var(--bad)" : "var(--ink)"; });
}

function report(T) {
  const on = within(T, REP[0] - .1, REP[1] + .3), ex = exitP(T, REP[1], .35);
  const k = sp(REP[0], T, 2.3, .84);
  tf($("rKick"), 0, (1 - k) * 16, 1, on ? clamp(k * 1.5) * (1 - ex) : 0);
  tf($("rTitle"), 0, -ex * 40, 1, on ? 1 - ex : 0);
  rise($("rTitle"), REP[0] + .05, T, .035);
  // national verdict arrives through the carrier; its badge leaves as the logo at 31.3
  tf($("v0"), 0, -ex * 40, 1, T < REP[1] + .3 ? lin(T, 26.45, 26.65) * (1 - ex) : 0);
  $("vb0").style.visibility = T >= 31.3 ? "hidden" : "visible";
  const p1 = sp(26.45, T, 2.4, .8);
  tf($("v1"), 0, (1 - p1) * 60 - ex * 40, 1, on ? clamp(p1 * 1.6) * (1 - ex) : 0);
  const g = sp(26.9, T, 2.2, .84);
  tf($("rGrid"), 0, (1 - g) * 70 - ex * 40, 1, on ? clamp(g * 1.6) * (1 - ex) : 0);
  let n = 0;
  rows.forEach((_, r) => [0, 1, 2].forEach((c) => { const p = sp(27.7 + (n++) * .18, T, 3.2, .72); tf($(`pl${r}${c}`), 0, 0, .55 + .45 * p, clamp(p * 1.7)); }));
  // a highlight walks down the rows: asks → reads → sends, read row by row
  rows.forEach((_, r) => { const c = 29.3 + r * .65; const w = lin(T, c, c + .25) * (1 - lin(T, c + .55, c + .8)); $("rg" + r).style.opacity = w.toFixed(3); });
  const cp = sp(29.2, T, 2.2, .86);
  tf($("rCap"), 0, (1 - cp) * 16 - ex * 40, 1, on ? clamp(cp * 1.6) * (1 - ex) : 0);
}

function ending(T) {
  const on = T >= END[0] - .05;
  ["eWord", "eLine", "eChip", "eUrl", "eRef"].forEach((id, i) => {
    const w = sp(31.7 + i * .06, T, 2.2, .84);
    tf($(id), 0, (1 - w) * 46 + (w >= .999 ? Math.sin(T * 1.2 + i) * 1.5 : 0), 1, on ? clamp(w * 1.4) : 0);
  });
  rise($("eLine"), -10, T, 0, 99);
}

window.seek = async (T) => {
  $("bg").style.transform = `translate(${(Math.sin(T * .35) * 30).toFixed(2)}px,${(Math.cos(T * .27) * 22).toFixed(2)}px)`;
  $("grid").style.transform = `translateY(${((T * 12) % 64).toFixed(2)}px)`;
  stepper(T); hook(T); card(T); upload(T); carriers(T); ai(T); scan(T); report(T); ending(T);
};

// preview: Space play/pause, ←/→ frame step, R replay
let playing = false, t0 = 0, tCur = 0;
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") { playing = !playing; t0 = performance.now() / 1000 - tCur; if (playing) loop(); }
  if (e.code === "ArrowRight") { tCur = Math.min(DURATION, tCur + 1 / 30); seek(tCur); }
  if (e.code === "ArrowLeft") { tCur = Math.max(0, tCur - 1 / 30); seek(tCur); }
  if (e.code === "KeyR") { tCur = 0; t0 = performance.now() / 1000; playing = true; loop(); }
});
function loop() { if (!playing) return; tCur = performance.now() / 1000 - t0; if (tCur > DURATION) { playing = false; tCur = DURATION; } seek(tCur); requestAnimationFrame(loop); }

window.CUES = CUES.sort((a, b) => a.t - b.t);
document.fonts.ready.then(() => { seek(0); window.ready = true; });
</script>
</body>
